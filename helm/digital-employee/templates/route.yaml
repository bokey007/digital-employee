{{- if .Values.route.enabled }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "digital-employee.fullname" . }}
  labels:
    {{- include "digital-employee.labels" . | nindent 4 }}
spec:
  host: {{ .Values.route.host }}
  to:
    kind: Service
    name: {{ include "digital-employee.fullname" . }}-frontend
    weight: 100
  port:
    targetPort: {{ .Values.frontend.port }}
  {{- if .Values.route.tls }}
  tls:
    termination: {{ .Values.route.tls.termination | default "edge" }}
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
---
# Backend API route (for frontend → backend communication)
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ include "digital-employee.fullname" . }}-api
  labels:
    {{- include "digital-employee.labels" . | nindent 4 }}
spec:
  host: api-{{ .Values.route.host }}
  path: /api
  to:
    kind: Service
    name: {{ include "digital-employee.fullname" . }}-backend
    weight: 100
  port:
    targetPort: {{ .Values.backend.port }}
  {{- if .Values.route.tls }}
  tls:
    termination: {{ .Values.route.tls.termination | default "edge" }}
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
{{- end }}
